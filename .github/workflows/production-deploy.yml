name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to deploy (example: v1.0.2)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Validate Version
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format."
            echo "Use format: v1.0.2"
            exit 1
          fi

          echo "Deploying version: ${{ inputs.version }}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy Release to EC2
        run: |
          VERSION="${{ inputs.version }}"
          IMAGE="443286885922.dkr.ecr.ap-south-1.amazonaws.com/cloud-cicd-platform:${VERSION}"

          echo "========================================"
          echo "🚀 PRODUCTION DEPLOYMENT"
          echo "========================================"
          echo "Version: $VERSION"
          echo "Image:   $IMAGE"
          echo "========================================"

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 443286885922.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull '"$IMAGE"'",
              "docker rm -f cloud-cicd-platform || true",
              "docker run -d --restart unless-stopped --name cloud-cicd-platform -p 80:5000 '"$IMAGE"',
              "sleep 5",
              "curl --fail http://localhost"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "❌ Production deployment failed."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}"
            exit 1
          fi

          echo "========================================"
          echo "✅ PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "========================================"
          echo "Version deployed: $VERSION"