
name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to deploy (example: v1.0.2)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Validate Version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format."
            echo "Use format: v1.0.2"
            exit 1
          fi

          echo "Deploying version: $VERSION"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy Release to EC2
        env:
          VERSION: ${{ inputs.version }}
        run: |
          VERSION="$VERSION"
          IMAGE="443286885922.dkr.ecr.ap-south-1.amazonaws.com/cloud-cicd-platform:${VERSION}"

          echo "========================================"
          echo "PRODUCTION DEPLOYMENT"
          echo "========================================"
          echo "Version: $VERSION"
          echo "Image:   $IMAGE"

          DEPLOY_SCRIPT=$(cat <<'REMOTE_SCRIPT'
          set -eu

          IMAGE="__IMAGE__"
          CONTAINER="cloud-cicd-platform"
          BACKUP="cloud-cicd-platform-backup"
          BACKUP_EXISTS=false

          rollback() {
            echo "Deployment failed. Starting rollback..."

            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true

            if [ "$BACKUP_EXISTS" = true ]; then
              if ! docker rename "$BACKUP" "$CONTAINER"; then
                echo "ERROR: Could not restore previous container name."
                return 1
              fi

              if ! docker start "$CONTAINER"; then
                echo "ERROR: Could not start previous container."
                return 1
              fi

              echo "Previous container restored."

              for attempt in $(seq 1 12); do
                if curl -fsS http://localhost/health >/dev/null; then
                  echo "Rollback health check passed."
                  return 0
                fi

                echo "Rollback attempt $attempt failed."
                sleep 5
              done

              echo "WARNING: Previous container restored but health check failed."
              return 1
            else
              echo "No previous container was available to restore."
              return 1
            fi
          }

          echo "Logging in to Amazon ECR..."
          ECR_PASSWORD=$(aws ecr get-login-password --region ap-south-1)
          printf '%s' "$ECR_PASSWORD" | docker login --username AWS --password-stdin 443286885922.dkr.ecr.ap-south-1.amazonaws.com
          unset ECR_PASSWORD

          echo "Pulling requested release..."
          docker pull "$IMAGE"

          echo "Retrieving application secret..."
          SECRET=$(aws ssm get-parameter \
            --name /cloud-cicd-platform/FLASK_SECRET_KEY \
            --with-decryption \
            --query Parameter.Value \
            --output text)

          if [ -z "$SECRET" ]; then
            echo "Secret retrieval failed."
            exit 1
          fi

          docker rm -f "$BACKUP" >/dev/null 2>&1 || true

          if docker inspect "$CONTAINER" >/dev/null 2>&1; then
            echo "Preserving currently running container..."

            if ! docker stop "$CONTAINER"; then
              echo "ERROR: Could not stop the existing container."
              docker start "$CONTAINER" || true
              exit 1
            fi

            if ! docker rename "$CONTAINER" "$BACKUP"; then
              echo "ERROR: Could not preserve the existing container."
              docker start "$CONTAINER" || true
              exit 1
            fi

            BACKUP_EXISTS=true
          fi

          echo "Starting requested release..."

          if ! docker run -d \
            --restart unless-stopped \
            --name "$CONTAINER" \
            -p 80:5000 \
            -e "FLASK_SECRET_KEY=$SECRET" \
            "$IMAGE"; then

            unset SECRET
            rollback
            exit 1
          fi

          unset SECRET

          echo "Checking application health..."

          HEALTHY=false

          for attempt in $(seq 1 12); do
            if curl -fsS http://localhost/health >/dev/null; then
              HEALTHY=true
              echo "Health check passed on attempt $attempt."
              break
            fi

            echo "Attempt $attempt failed. Retrying in 5 seconds..."
            sleep 5
          done

          if [ "$HEALTHY" != true ]; then
            echo "New release failed its health check."
            docker logs "$CONTAINER" || true
            rollback
            exit 1
          fi

          if [ "$BACKUP_EXISTS" = true ]; then
            echo "Removing previous container backup..."
            docker rm -f "$BACKUP"
          fi

          echo "========================================"
          echo "PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "Version: $IMAGE"
          echo "========================================"
          REMOTE_SCRIPT
          )

          PARAMS=$(jq -n \
            --arg image "$IMAGE" \
            --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script | gsub("__IMAGE__"; $image)]}')

          COMMAND_ID=$(aws ssm send-command \
            --region ap-south-1 \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --region ap-south-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true

          STATUS=$(aws ssm get-command-invocation \
            --region ap-south-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Production deployment failed."

            aws ssm get-command-invocation \
              --region ap-south-1 \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

            exit 1
          fi

          echo "========================================"
          echo "PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "========================================"
          echo "Version deployed: $VERSION"
