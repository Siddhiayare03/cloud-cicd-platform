name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Release Version
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "SHA=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build \
            -t cloud-cicd-platform:${VERSION} \
            -t cloud-cicd-platform:${SHA} \
            .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Hub Images
        run: |
          docker tag cloud-cicd-platform:${VERSION} \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-cicd-platform:${VERSION}

          docker tag cloud-cicd-platform:${VERSION} \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-cicd-platform:${SHA}

      - name: Push Docker Hub Images
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-cicd-platform:${VERSION}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-cicd-platform:${SHA}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag ECR Images
        run: |
          docker tag cloud-cicd-platform:${VERSION} \
            ${{ steps.login-ecr.outputs.registry }}/cloud-cicd-platform:${VERSION}

          docker tag cloud-cicd-platform:${VERSION} \
            ${{ steps.login-ecr.outputs.registry }}/cloud-cicd-platform:${SHA}

      - name: Push ECR Images
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/cloud-cicd-platform:${VERSION}

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/cloud-cicd-platform:${SHA}

      - name: Display Release Information
        run: |
          echo "========================================"
          echo "🚀 RELEASE BUILD"
          echo "========================================"
          echo "Version:"
          echo "${VERSION}"
          echo ""
          echo "Commit SHA:"
          echo "${SHA}"
          echo ""
          echo "Docker Hub:"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/cloud-cicd-platform:${VERSION}"
          echo ""
          echo "ECR:"
          echo "${{ steps.login-ecr.outputs.registry }}/cloud-cicd-platform:${VERSION}"
          echo "========================================"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true