name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      # 4. Run tests
      - name: Run Tests
        run: |
          python -m pytest tests

      # 5. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t cloud-cicd-platform:${{ github.sha }} .

      # 6. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Tag Docker image
      - name: Tag Docker Image
        run: |
          docker tag cloud-cicd-platform:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-cicd-platform:${{ github.sha }}

          docker tag cloud-cicd-platform:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-cicd-platform:latest

      # 8. Push Docker image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-cicd-platform:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-cicd-platform:latest