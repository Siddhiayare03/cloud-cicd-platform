name: CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      # 4. Run tests
      - name: Run Tests
        run: |
          python -m pytest tests

      # 5. Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t cloud-cicd-platform:${{ github.sha }} .

      # 6. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Tag Docker image for Docker Hub
      - name: Tag Docker Image for Docker Hub
        run: |
          docker tag cloud-cicd-platform:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-cicd-platform:${{ github.sha }}

          docker tag cloud-cicd-platform:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-cicd-platform:latest

      # 8. Push Docker image to Docker Hub
      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-cicd-platform:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloud-cicd-platform:latest

      # 9. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      # 10. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 11. Tag Docker image for ECR
      - name: Tag Docker Image for ECR
        run: |
          docker tag cloud-cicd-platform:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/cloud-cicd-platform:${{ github.sha }}

          docker tag cloud-cicd-platform:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/cloud-cicd-platform:latest

      # 12. Push Docker image to ECR
      - name: Push Docker Image to ECR
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/cloud-cicd-platform:${{ github.sha }}
          docker push ${{ steps.login-ecr.outputs.registry }}/cloud-cicd-platform:latest

      # 13. Deploy latest image to EC2 using AWS Systems Manager
      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --parameters 'commands=[
              "aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 443286885922.dkr.ecr.ap-south-1.amazonaws.com",
              "docker pull 443286885922.dkr.ecr.ap-south-1.amazonaws.com/cloud-cicd-platform:latest",
              "docker rm -f cloud-cicd-platform || true",
              "docker run -d --name cloud-cicd-platform -p 80:5000 443286885922.dkr.ecr.ap-south-1.amazonaws.com/cloud-cicd-platform:latest",
              "sleep 5",
              "curl --fail http://localhost"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          echo "Deployment command completed."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi

          echo "🚀 Deployment successful!"